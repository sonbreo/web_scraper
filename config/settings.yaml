searches:
  - url: "https://www.gumtree.com.au/s-video-games-consoles/melbourne/nintendo+switch+console/k0c18459l3001317r50"
    keywords: ["nintendo", "switch", "console"]

filters:
  price:
    min: 100
    max: 500
  max_age_days: 7
  exclude_keywords: ["parts only", "broken", "faulty"]
  seller_type: all  # private, dealer, all
  location: null    # optional substring match, e.g. "Melbourne"

features:
  notifications:
    email: false
    email_config:
      smtp_host: ""       # or set SMTP_HOST env var
      smtp_port: 587
      username: ""        # or set SMTP_USERNAME env var
      password: ""        # or set SMTP_PASSWORD env var
      from: ""            # or set SMTP_FROM env var
      to: ""              # or set SMTP_TO env var
    discord: false
    discord_webhook: ""   # or set DISCORD_WEBHOOK_URL env var
  output:
    csv: true
    json: false
    sqlite: false

http:
  request_delay: 2.0
  timeout: 10
  max_retries: 3
  proxies: []

scheduling:
  interval_seconds: 900   # 15 minutes; ignored when running with --once
